name: LaraPaper (local)
version: "0.43.0-2"
slug: larapaper_local
description: >-
  TRMNL BYOS server (LaraPaper) that renders screens without internet access:
  the TRMNL framework and FullCalendar are bundled in the image.
url: https://github.com/BartSchuurmans/trmnl-homeassistant-calendar/tree/main/larapaper
arch:
  - aarch64
  - amd64
init: false
startup: services
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: LaraPaper web UI and TRMNL device API
webui: http://[HOST]:[PORT:8080]
options:
  app_url: ""
  registration_enabled: true
schema:
  app_url: url
  registration_enabled: bool
