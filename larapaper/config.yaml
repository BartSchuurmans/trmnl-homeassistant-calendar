name: LaraPaper (local)
version: "0.43.1-2"
slug: larapaper_local
description: >-
  TRMNL BYOS server (LaraPaper) that renders screens without internet access:
  the TRMNL framework and FullCalendar are bundled in the image.
url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar/tree/main/larapaper
# Built and published by .github/workflows/app.yml when the version changes on main
image: ghcr.io/bartschuurmans/larapaper-local
arch:
  - aarch64
  - amd64
init: false
# The Supervisor token lets the bundled calendar proxy read Home Assistant calendars
homeassistant_api: true
startup: services
ports:
  8080/tcp: 4567
ports_description:
  8080/tcp: LaraPaper web UI and TRMNL device API
webui: http://[HOST]:[PORT:8080]
options:
  app_url: ""
  registration_enabled: true
schema:
  app_url: url
  registration_enabled: bool
