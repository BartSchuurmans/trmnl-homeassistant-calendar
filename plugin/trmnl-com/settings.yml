---
# The recipe on TRMNL.com (trmnlp format): the settings of plugin/src/settings.yml with
# the Plugin Merge strategy instead of polling. scripts/build-variant.sh puts this next
# to plugin/src's views and merge.liquid + shared.liquid; see plugin/README.md.
#
# The form fields are the same settings as plugin/src/settings.yml, minus the sources
# TRMNL.com can't use (ICS feeds need a server that parses them, Home Assistant would have
# to be public), with "Calendar" dropdowns instead of plugin IDs and an API key. preview/variants.mjs checks that the settings both have
# match in type, name, options, default and order.
name: Rolling Month Calendar
refresh_interval: 15
strategy: plugin_merge
no_screen_padding: 'yes'
dark_mode: 'no'
static_data: ''
framework_version: 3.3.1
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About
    category: calendar
    description: "All your TRMNL calendar plugins in one rolling month grid, with what the built-in layout lacks:<br/>• up to four calendars from different accounts and providers (Google, Outlook, CalDAV, ...) in one grid<br/>• a color and a prefix per calendar<br/>• half and quadrant views for mashups<br/>• busy weeks never cut off: fewer weeks, or \"+N more\"<br/>• finished events faded<br/>Setup: set each calendar plugin's layout to Rolling Month, keep it in a playlist (it can be hidden), then pick it below."
    github_url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar
    email_address: bart@minnozz.com
  - keyname: calendar_1
    field_type: plugin_instance_select
    name: Calendar
    description: One of your TRMNL calendar plugins (Google, Outlook, Apple, CalDAV, ...); the list shows all your plugins. Set its layout to Rolling Month, or it only shares the events of its own, shorter view. Keep it in a playlist (it can be hidden), or its events stop refreshing.
  - keyname: calendar_2
    field_type: plugin_instance_select
    name: Calendar 2
    description: 'Optional: another calendar plugin, set up the same way.'
    optional: true
  - keyname: calendar_3
    field_type: plugin_instance_select
    name: Calendar 3
    description: 'Optional: another calendar plugin, set up the same way.'
    optional: true
  - keyname: calendar_4
    field_type: plugin_instance_select
    name: Calendar 4
    description: 'Optional: another calendar plugin, set up the same way.'
    optional: true
  - keyname: calendar_labels
    field_type: multi_string
    name: Calendar prefixes
    description: Optional text shown before each event title, one per calendar in the same order as the calendars above (e.g. W:, Kids). Use - for a calendar without one.
    optional: true
  - keyname: calendar_colors
    field_type: multi_string
    name: Calendar colors
    description: Optional event background, one per calendar in the same order as the calendars above. A TRMNL color name (black, gray-10 … gray-75, red, blue-40, …) or a hex color. Names become solid greys on the TRMNL X and dither patterns on 1-bit screens. Use - for a calendar without one.
    optional: true
  - keyname: time_zone
    field_type: time_zone
    name: Time zone
    description: Leave empty to use your account's time zone.
    optional: true
  - keyname: first_day
    field_type: select
    name: Week starts on
    options:
    - Sunday: '0'
    - Monday: '1'
    - Saturday: '6'
    default: '1'
  - keyname: rolling_advancement
    field_type: select
    name: Advance
    description: Start the grid at the beginning of the current week, or at today.
    options:
    - Weekly: week
    - Daily: day
    default: week
  - keyname: time_format
    field_type: select
    name: Time format
    options:
    - 24 hour: 24h
    - AM/PM: am/pm
    default: 24h
  - keyname: include_event_time
    field_type: select
    name: Show event times
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: display_event_end
    field_type: select
    name: Show event end times
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: include_past_events
    field_type: select
    name: Show past events
    description: Show events on days before today that are still in the grid.
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: highlight_today
    field_type: select
    name: Highlight today
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: fade_past_events
    field_type: select
    name: Fade past events
    description: Grey out events that are over (on earlier days). Greyscale screens only; 1-bit and 2-bit screens show them as usual.
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: shade_weekends
    field_type: select
    name: Shade weekends
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'yes'
  - keyname: week_overflow
    field_type: select
    name: Busy weeks
    description: When the weeks don't all fit, show fewer weeks so every event stays visible, or keep at least 3 weeks and end a full day with "+N more".
    options:
    - Show fewer weeks: fewer_weeks
    - Show "+N more": more
    default: fewer_weeks
  - keyname: month_header
    field_type: select
    name: Show title bar
    description: TRMNL title bar at the bottom with the recipe name and the visible date range.
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'no'
  - keyname: show_week_numbers
    field_type: select
    name: Show week numbers
    options:
    - 'Yes': 'yes'
    - 'No': 'no'
    default: 'no'
  - keyname: locale
    field_type: string
    name: Locale
    description: Language for day and month names, e.g. en, nl, de, fr.
    default: en
    optional: true
  - keyname: ignored_phrases
    field_type: multi_string
    name: Ignore events containing
    description: Events whose title or description contains any of these phrases are hidden.
    optional: true
  - keyname: ignored_phrases_exact_match
    field_type: multi_string
    name: Ignore events titled exactly
    description: Events whose title is exactly one of these are hidden.
    optional: true
