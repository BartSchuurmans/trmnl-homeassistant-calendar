---
# Daily Forecast (trmnlp format): the companion recipe that gives the Rolling Month
# Calendar on TRMNL.com (plugin/trmnl-com) a forecast for every day it shows. It polls
# Open-Meteo's daily forecast (no key) for a location; the calendar's "Weather" dropdown
# picks this plugin up through Plugin Merge and reads the same JSON. Its own screen is a
# simple week of forecasts. See plugin/README.md.
#
# Hourly: every TRMNL.com poll comes from TRMNL's servers and shares Open-Meteo's free
# limit (per IP), and a daily forecast changes slowly.
name: Daily Forecast
refresh_interval: 60
strategy: polling
polling_verb: get
polling_url: 'https://api.open-meteo.com/v1/forecast?latitude={{ latitude | strip }}&longitude={{ longitude | strip }}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=16&temperature_unit={{ temperature_unit | default: "celsius" }}'
polling_headers: ''
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
framework_version: 3.3.1
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About
    category: environment
    description: "The daily weather forecast for the next two weeks from <a href=\"https://open-meteo.com\" class=\"underline\">Open-Meteo</a> (no account or key): each day's weather, high and low.<br/>Made for the Rolling Month Calendar recipe, which shows it next to its day numbers: pick this plugin in its Weather dropdown, and keep this one in a playlist (it can be hidden) so it keeps refreshing."
    github_url: https://github.com/BartSchuurmans/trmnl-rolling-month-calendar
    email_address: bart@minnozz.com
  - keyname: latitude
    field_type: string
    name: Latitude
    description: Your location's latitude in decimal degrees, e.g. 52.37 (north is positive). Look it up on latlong.net or in a map app.
    placeholder: '52.37'
  - keyname: longitude
    field_type: string
    name: Longitude
    description: Your location's longitude in decimal degrees, e.g. 4.89 (east is positive).
    placeholder: '4.89'
  - keyname: temperature_unit
    field_type: select
    name: Temperature unit
    options:
    - Celsius: celsius
    - Fahrenheit: fahrenheit
    default: celsius
