---
# TRMNL recipe settings (trmnlp format). Import into LaraPaper as a ZIP, see README.md.
name: Home Assistant Calendar
id: ha-calendar-rolling-month
refresh_interval: 15
strategy: polling
polling_verb: get
# One URL per calendar entity. LaraPaper resolves this with Liquid (PHP DateTime
# understands relative dates like "today -7 days") on every refresh, so the window
# always covers the rolling month: the current week plus up to 6 weeks ahead.
polling_url: |-
  {% assign cals = calendars | split: "," %}{% for cal in cals %}{{ ha_url }}/api/calendars/{{ cal | strip }}?start={{ "today -7 days" | date: "%Y-%m-%d" }}&end={{ "today +43 days" | date: "%Y-%m-%d" }}
  {% endfor %}
polling_headers: Authorization=Bearer {{ ha_token }}
static_data: '{}'
# Framework version this recipe is built and tested against (LaraPaper's default).
framework_version: 3.3.1
custom_fields:
  - keyname: about
    field_type: author_bio
    name: About
    description: Rolling month calendar fed by Home Assistant calendar entities. Forked from the TRMNL native calendar plugin.
  - keyname: ha_url
    field_type: url
    name: Home Assistant URL
    description: Base URL of your Home Assistant instance, reachable from the BYOS server. No trailing slash. The default is the LaraPaper (local) Home Assistant app's own calendar access, which needs no token.
    default: http://127.0.0.1:8124
    placeholder: http://homeassistant.local:8123
  - keyname: ha_token
    field_type: password
    name: Home Assistant access token
    description: Long-lived access token (HA profile → Security → Long-lived access tokens). Leave empty with the LaraPaper (local) app's default URL.
    optional: true
  - keyname: calendars
    field_type: multi_string
    name: Calendar entities
    description: One or more HA calendar entity IDs.
    placeholder: calendar.family
  - keyname: calendar_labels
    field_type: multi_string
    name: Calendar prefixes
    description: Optional text shown before each event title, one per calendar in the same order as the entities (e.g. W:, Kids). Use - for a calendar without one.
    optional: true
  - keyname: calendar_colors
    field_type: multi_string
    name: Calendar colors
    description: Optional event background, one per calendar in the same order as the entities. A TRMNL color name (black, gray-10 … gray-75, red, blue-40, …) or a hex color. Names become solid greys on the TRMNL X and dither patterns on 1-bit screens. Use - for a calendar without one.
    optional: true
  - keyname: time_zone
    field_type: time_zone
    name: Time zone
    description: Leave empty to use your LaraPaper user time zone.
    optional: true
  - keyname: first_day
    field_type: select
    name: Week starts on
    options:
      - Sunday: '0'
      - Monday: '1'
      - Saturday: '6'
    default: '1'
  - keyname: rolling_advancement
    field_type: select
    name: Advance
    description: Start the grid at the beginning of the current week, or at today.
    options:
      - Weekly: week
      - Daily: day
    default: week
  - keyname: time_format
    field_type: select
    name: Time format
    options:
      - 24 hour: 24h
      - AM/PM: am/pm
    default: 24h
  - keyname: include_event_time
    field_type: select
    name: Show event times
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: display_event_end
    field_type: select
    name: Show event end times
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: include_past_events
    field_type: select
    name: Show past events
    description: Show events on days before today that are still in the grid.
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: highlight_today
    field_type: select
    name: Highlight today
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: fade_past_events
    field_type: select
    name: Fade past events
    description: Grey out events that are over (on earlier days). Greyscale screens only; 1-bit and 2-bit screens with Adapt styles show them as usual.
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: shade_weekends
    field_type: select
    name: Shade weekends
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'yes'
  - keyname: dither_greys
    field_type: select
    name: Greys on 1-bit / 2-bit screens
    description: Adapt swaps greys for pixel patterns and solid black text. Dither keeps the greys and has LaraPaper dither the whole screen (text edges get slightly grainy). No effect on 4-bit screens like the TRMNL X, which LaraPaper always dithers.
    options:
      - Adapt styles: 'no'
      - Dither: 'yes'
    default: 'no'
  - keyname: week_overflow
    field_type: select
    name: Busy weeks
    description: When the weeks don't all fit, show fewer weeks so every event stays visible, or keep at least 3 weeks and end a full day with "+N more".
    options:
      - Show fewer weeks: fewer_weeks
      - Show "+N more": more
    default: fewer_weeks
  - keyname: month_header
    field_type: select
    name: Show title bar
    description: TRMNL title bar at the bottom with the recipe name and the visible date range.
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'no'
  - keyname: show_week_numbers
    field_type: select
    name: Show week numbers
    options:
      - 'Yes': 'yes'
      - 'No': 'no'
    default: 'no'
  - keyname: locale
    field_type: string
    name: Locale
    description: Language for day and month names, e.g. en, nl, de, fr.
    default: en
    optional: true
  - keyname: ignored_phrases
    field_type: multi_string
    name: Ignore events containing
    description: Events whose title or description contains any of these phrases are hidden.
    optional: true
  - keyname: ignored_phrases_exact_match
    field_type: multi_string
    name: Ignore events titled exactly
    optional: true
