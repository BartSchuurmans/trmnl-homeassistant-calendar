# Dependency updates for CI and the preview tooling only. Versions that must move in
# step across the recipe, the app and the previews are left out (see CLAUDE.md):
# FullCalendar (assets.txt hashes, shared.liquid, app.yml), LaraPaper (larapaper/Dockerfile,
# config.yaml, keepsuit/liquid in preview/php), the TRMNL framework and trmnlp.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /preview
    schedule:
      interval: monthly
    groups:
      preview:
        patterns: ["*"]
    ignore:
      # Pinned to the version the recipe loads and the app bundles.
      - dependency-name: fullcalendar
      - dependency-name: "@fullcalendar/core"
