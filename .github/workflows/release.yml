name: Release

# Pushing a tag like v1.2.0 runs the render checks and publishes a GitHub release
# with the recipe ZIP (dist/ha-calendar.zip) and its SHA-256. The asset name stays the
# same, so the README can link to releases/latest/download/ha-calendar.zip.
#
# The Home Assistant app is released separately: Home Assistant offers an update
# whenever `version` in larapaper/config.yaml changes on main.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  render:
    uses: ./.github/workflows/render.yml

  release:
    needs: render
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # build-zip.sh dates the ZIP by the last plugin/src commit

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME is not on main"
            exit 1
          fi

      - name: Build recipe ZIP
        run: |
          sh scripts/build-zip.sh
          cd dist && sha256sum ha-calendar.zip > ha-calendar.zip.sha256 && cat ha-calendar.zip.sha256

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/ha-calendar.zip dist/ha-calendar.zip.sha256 \
            --verify-tag --title "$GITHUB_REF_NAME" --generate-notes
